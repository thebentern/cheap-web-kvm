<div class="kvm-panel flex max-h-[80vh] w-[min(40rem,92vw)] flex-col overflow-hidden">

    <div class="quick-access-drag-bar flex items-center justify-between gap-3 border-b border-ink-600 bg-ink-800/60 px-3 py-2">
        <div class="flex min-w-0 items-center gap-2">
            <i class="bolt icon text-signal-400"></i>
            <span class="text-[13px] font-semibold text-mist-100">Quick access</span>
            <span class="hidden text-[11px] text-mist-400 sm:inline">drag to move</span>
        </div>
        <button class="kvm-btn kvm-btn-icon" id="closeQuickAccess" title="Close">
            <i class="times icon"></i>
        </button>
    </div>

    <div class="kvm-scroll flex-1 space-y-5 px-3 py-3">

        <!-- Windows -->
        <section>
            <div class="mb-2 flex items-center gap-2">
                <h4 class="text-[11px] font-semibold uppercase tracking-[0.12em] text-mist-400">Windows</h4>
                <span class="h-px flex-1 bg-ink-600"></span>
            </div>
            <div class="grid grid-cols-2 gap-1.5 md:grid-cols-3">
                <button class="hotkey-btn min-w-0" data-action="ctrl-alt-del" title="Send Ctrl+Alt+Del">
                    <i class="lock icon text-[15px] text-mist-400"></i>
                    <span class="min-w-0">
                        <span class="block truncate font-mono text-[11px]">Ctrl+Alt+Del</span>
                        <span class="block truncate text-[10px] text-mist-400">Security screen</span>
                    </span>
                </button>
                <button class="hotkey-btn min-w-0" data-action="win-shift-s" title="Send Win+Shift+S">
                    <i class="camera icon text-[15px] text-mist-400"></i>
                    <span class="min-w-0">
                        <span class="block truncate font-mono text-[11px]">Win+Shift+S</span>
                        <span class="block truncate text-[10px] text-mist-400">Snip a region</span>
                    </span>
                </button>
                <button class="hotkey-btn min-w-0" data-action="win-l" title="Send Win+L">
                    <i class="lock icon text-[15px] text-mist-400"></i>
                    <span class="min-w-0">
                        <span class="block truncate font-mono text-[11px]">Win+L</span>
                        <span class="block truncate text-[10px] text-mist-400">Lock session</span>
                    </span>
                </button>
                <button class="hotkey-btn min-w-0" data-action="win-d" title="Send Win+D">
                    <i class="desktop icon text-[15px] text-mist-400"></i>
                    <span class="min-w-0">
                        <span class="block truncate font-mono text-[11px]">Win+D</span>
                        <span class="block truncate text-[10px] text-mist-400">Show desktop</span>
                    </span>
                </button>
                <button class="hotkey-btn min-w-0" data-action="win-e" title="Send Win+E">
                    <i class="folder icon text-[15px] text-mist-400"></i>
                    <span class="min-w-0">
                        <span class="block truncate font-mono text-[11px]">Win+E</span>
                        <span class="block truncate text-[10px] text-mist-400">File Explorer</span>
                    </span>
                </button>
                <button class="hotkey-btn min-w-0" data-action="win-r" title="Send Win+R">
                    <i class="terminal icon text-[15px] text-mist-400"></i>
                    <span class="min-w-0">
                        <span class="block truncate font-mono text-[11px]">Win+R</span>
                        <span class="block truncate text-[10px] text-mist-400">Run dialog</span>
                    </span>
                </button>
                <button class="hotkey-btn min-w-0" data-action="ctrl-shift-esc" title="Send Ctrl+Shift+Esc">
                    <i class="cog icon text-[15px] text-mist-400"></i>
                    <span class="min-w-0">
                        <span class="block truncate font-mono text-[11px]">Ctrl+Shift+Esc</span>
                        <span class="block truncate text-[10px] text-mist-400">Task Manager</span>
                    </span>
                </button>
                <button class="hotkey-btn min-w-0" data-action="alt-f4" title="Send Alt+F4">
                    <i class="times icon text-[15px] text-mist-400"></i>
                    <span class="min-w-0">
                        <span class="block truncate font-mono text-[11px]">Alt+F4</span>
                        <span class="block truncate text-[10px] text-mist-400">Close window</span>
                    </span>
                </button>
            </div>
        </section>

        <!-- macOS -->
        <section>
            <div class="mb-2 flex items-center gap-2">
                <h4 class="text-[11px] font-semibold uppercase tracking-[0.12em] text-mist-400">macOS</h4>
                <span class="h-px flex-1 bg-ink-600"></span>
            </div>
            <div class="grid grid-cols-2 gap-1.5 md:grid-cols-3">
                <button class="hotkey-btn min-w-0" data-action="cmd-z" title="Send Command+Z">
                    <i class="undo icon text-[15px] text-mist-400"></i>
                    <span class="min-w-0">
                        <span class="block truncate font-mono text-[11px]">⌘+Z</span>
                        <span class="block truncate text-[10px] text-mist-400">Undo</span>
                    </span>
                </button>
                <button class="hotkey-btn min-w-0" data-action="cmd-x" title="Send Command+X">
                    <i class="crop icon text-[15px] text-mist-400"></i>
                    <span class="min-w-0">
                        <span class="block truncate font-mono text-[11px]">⌘+X</span>
                        <span class="block truncate text-[10px] text-mist-400">Cut</span>
                    </span>
                </button>
                <button class="hotkey-btn min-w-0" data-action="cmd-c" title="Send Command+C">
                    <i class="clipboard icon text-[15px] text-mist-400"></i>
                    <span class="min-w-0">
                        <span class="block truncate font-mono text-[11px]">⌘+C</span>
                        <span class="block truncate text-[10px] text-mist-400">Copy</span>
                    </span>
                </button>
                <button class="hotkey-btn min-w-0" data-action="cmd-v" title="Send Command+V">
                    <i class="clipboard icon text-[15px] text-mist-400"></i>
                    <span class="min-w-0">
                        <span class="block truncate font-mono text-[11px]">⌘+V</span>
                        <span class="block truncate text-[10px] text-mist-400">Paste</span>
                    </span>
                </button>
                <button class="hotkey-btn min-w-0" data-action="cmd-a" title="Send Command+A">
                    <i class="mouse pointer icon text-[15px] text-mist-400"></i>
                    <span class="min-w-0">
                        <span class="block truncate font-mono text-[11px]">⌘+A</span>
                        <span class="block truncate text-[10px] text-mist-400">Select all</span>
                    </span>
                </button>
                <button class="hotkey-btn min-w-0" data-action="cmd-s" title="Send Command+S">
                    <i class="download icon text-[15px] text-mist-400"></i>
                    <span class="min-w-0">
                        <span class="block truncate font-mono text-[11px]">⌘+S</span>
                        <span class="block truncate text-[10px] text-mist-400">Save</span>
                    </span>
                </button>
                <button class="hotkey-btn min-w-0" data-action="cmd-f" title="Send Command+F">
                    <i class="search icon text-[15px] text-mist-400"></i>
                    <span class="min-w-0">
                        <span class="block truncate font-mono text-[11px]">⌘+F</span>
                        <span class="block truncate text-[10px] text-mist-400">Find</span>
                    </span>
                </button>
                <button class="hotkey-btn min-w-0" data-action="cmd-w" title="Send Command+W">
                    <i class="times icon text-[15px] text-mist-400"></i>
                    <span class="min-w-0">
                        <span class="block truncate font-mono text-[11px]">⌘+W</span>
                        <span class="block truncate text-[10px] text-mist-400">Close window</span>
                    </span>
                </button>
                <button class="hotkey-btn min-w-0" data-action="cmd-q" title="Send Command+Q">
                    <i class="power icon text-[15px] text-mist-400"></i>
                    <span class="min-w-0">
                        <span class="block truncate font-mono text-[11px]">⌘+Q</span>
                        <span class="block truncate text-[10px] text-mist-400">Quit app</span>
                    </span>
                </button>
                <button class="hotkey-btn min-w-0" data-action="cmd-space" title="Send Command+Space">
                    <i class="search icon text-[15px] text-mist-400"></i>
                    <span class="min-w-0">
                        <span class="block truncate font-mono text-[11px]">⌘+Space</span>
                        <span class="block truncate text-[10px] text-mist-400">Spotlight</span>
                    </span>
                </button>
                <button class="hotkey-btn min-w-0" data-action="cmd-tab" title="Send Command+Tab">
                    <i class="exchange icon text-[15px] text-mist-400"></i>
                    <span class="min-w-0">
                        <span class="block truncate font-mono text-[11px]">⌘+Tab</span>
                        <span class="block truncate text-[10px] text-mist-400">Switch apps</span>
                    </span>
                </button>
                <button class="hotkey-btn min-w-0" data-action="cmd-option-esc" title="Send Command+Option+Esc">
                    <i class="stop icon text-[15px] text-mist-400"></i>
                    <span class="min-w-0">
                        <span class="block truncate font-mono text-[11px]">⌘+⌥+Esc</span>
                        <span class="block truncate text-[10px] text-mist-400">Force quit</span>
                    </span>
                </button>
                <button class="hotkey-btn min-w-0" data-action="cmd-h" title="Send Command+H">
                    <i class="eye icon text-[15px] text-mist-400"></i>
                    <span class="min-w-0">
                        <span class="block truncate font-mono text-[11px]">⌘+H</span>
                        <span class="block truncate text-[10px] text-mist-400">Hide window</span>
                    </span>
                </button>
                <button class="hotkey-btn min-w-0" data-action="cmd-m" title="Send Command+M">
                    <i class="compress icon text-[15px] text-mist-400"></i>
                    <span class="min-w-0">
                        <span class="block truncate font-mono text-[11px]">⌘+M</span>
                        <span class="block truncate text-[10px] text-mist-400">Minimize</span>
                    </span>
                </button>
                <button class="hotkey-btn min-w-0" data-action="cmd-option-d" title="Send Command+Option+D">
                    <i class="desktop icon text-[15px] text-mist-400"></i>
                    <span class="min-w-0">
                        <span class="block truncate font-mono text-[11px]">⌘+⌥+D</span>
                        <span class="block truncate text-[10px] text-mist-400">Toggle Dock</span>
                    </span>
                </button>
            </div>
        </section>

        <!-- Linux -->
        <section>
            <div class="mb-2 flex items-center gap-2">
                <h4 class="text-[11px] font-semibold uppercase tracking-[0.12em] text-mist-400">Linux</h4>
                <span class="h-px flex-1 bg-ink-600"></span>
            </div>
            <div class="grid grid-cols-2 gap-1.5 md:grid-cols-3">
                <button class="hotkey-btn min-w-0" data-action="ctrl-alt-t" title="Send Ctrl+Alt+T">
                    <i class="terminal icon text-[15px] text-mist-400"></i>
                    <span class="min-w-0">
                        <span class="block truncate font-mono text-[11px]">Ctrl+Alt+T</span>
                        <span class="block truncate text-[10px] text-mist-400">Terminal</span>
                    </span>
                </button>
                <button class="hotkey-btn min-w-0" data-action="super-l" title="Send Super+L">
                    <i class="lock icon text-[15px] text-mist-400"></i>
                    <span class="min-w-0">
                        <span class="block truncate font-mono text-[11px]">Super+L</span>
                        <span class="block truncate text-[10px] text-mist-400">Lock screen</span>
                    </span>
                </button>
            </div>
        </section>

        <!-- Editing and navigation -->
        <section>
            <div class="mb-2 flex items-center gap-2">
                <h4 class="text-[11px] font-semibold uppercase tracking-[0.12em] text-mist-400">Editing &amp; navigation</h4>
                <span class="h-px flex-1 bg-ink-600"></span>
            </div>
            <div class="grid grid-cols-2 gap-1.5 md:grid-cols-3">
                <!-- Alt+Tab stays out: sendKeyCombination releases Alt straight after Tab,
                     so the switcher closes before you can pick a window.
                <button class="hotkey-btn min-w-0" data-action="alt-tab" title="Send Alt+Tab">
                    <i class="exchange icon text-[15px] text-mist-400"></i>
                    <span class="min-w-0">
                        <span class="block truncate font-mono text-[11px]">Alt+Tab</span>
                        <span class="block truncate text-[10px] text-mist-400">Switch apps</span>
                    </span>
                </button>
                -->
                <button class="hotkey-btn min-w-0" data-action="f2" title="Send F2">
                    <i class="wrench icon text-[15px] text-mist-400"></i>
                    <span class="min-w-0">
                        <span class="block truncate font-mono text-[11px]">F2</span>
                        <span class="block truncate text-[10px] text-mist-400">Rename</span>
                    </span>
                </button>
                <button class="hotkey-btn min-w-0" data-action="ctrl-c" title="Send Ctrl+C">
                    <i class="clipboard icon text-[15px] text-mist-400"></i>
                    <span class="min-w-0">
                        <span class="block truncate font-mono text-[11px]">Ctrl+C</span>
                        <span class="block truncate text-[10px] text-mist-400">Copy</span>
                    </span>
                </button>
                <button class="hotkey-btn min-w-0" data-action="ctrl-v" title="Send Ctrl+V">
                    <i class="clipboard icon text-[15px] text-mist-400"></i>
                    <span class="min-w-0">
                        <span class="block truncate font-mono text-[11px]">Ctrl+V</span>
                        <span class="block truncate text-[10px] text-mist-400">Paste</span>
                    </span>
                </button>
                <button class="hotkey-btn min-w-0" data-action="ctrl-z" title="Send Ctrl+Z">
                    <i class="undo icon text-[15px] text-mist-400"></i>
                    <span class="min-w-0">
                        <span class="block truncate font-mono text-[11px]">Ctrl+Z</span>
                        <span class="block truncate text-[10px] text-mist-400">Undo</span>
                    </span>
                </button>
                <button class="hotkey-btn min-w-0" data-action="ctrl-y" title="Send Ctrl+Y">
                    <i class="sync icon text-[15px] text-mist-400"></i>
                    <span class="min-w-0">
                        <span class="block truncate font-mono text-[11px]">Ctrl+Y</span>
                        <span class="block truncate text-[10px] text-mist-400">Redo</span>
                    </span>
                </button>
                <button class="hotkey-btn min-w-0" data-action="ctrl-a" title="Send Ctrl+A">
                    <i class="mouse pointer icon text-[15px] text-mist-400"></i>
                    <span class="min-w-0">
                        <span class="block truncate font-mono text-[11px]">Ctrl+A</span>
                        <span class="block truncate text-[10px] text-mist-400">Select all</span>
                    </span>
                </button>
                <button class="hotkey-btn min-w-0" data-action="ctrl-f" title="Send Ctrl+F">
                    <i class="search icon text-[15px] text-mist-400"></i>
                    <span class="min-w-0">
                        <span class="block truncate font-mono text-[11px]">Ctrl+F</span>
                        <span class="block truncate text-[10px] text-mist-400">Find</span>
                    </span>
                </button>
                <button class="hotkey-btn min-w-0" data-action="ctrl-s" title="Send Ctrl+S">
                    <i class="download icon text-[15px] text-mist-400"></i>
                    <span class="min-w-0">
                        <span class="block truncate font-mono text-[11px]">Ctrl+S</span>
                        <span class="block truncate text-[10px] text-mist-400">Save</span>
                    </span>
                </button>
                <button class="hotkey-btn min-w-0" data-action="ctrl-p" title="Send Ctrl+P">
                    <i class="print icon text-[15px] text-mist-400"></i>
                    <span class="min-w-0">
                        <span class="block truncate font-mono text-[11px]">Ctrl+P</span>
                        <span class="block truncate text-[10px] text-mist-400">Print</span>
                    </span>
                </button>
                <button class="hotkey-btn min-w-0" data-action="f5" title="Send F5">
                    <i class="sync icon text-[15px] text-mist-400"></i>
                    <span class="min-w-0">
                        <span class="block truncate font-mono text-[11px]">F5</span>
                        <span class="block truncate text-[10px] text-mist-400">Refresh</span>
                    </span>
                </button>
                <button class="hotkey-btn min-w-0" data-action="ctrl-w" title="Send Ctrl+W">
                    <i class="times icon text-[15px] text-mist-400"></i>
                    <span class="min-w-0">
                        <span class="block truncate font-mono text-[11px]">Ctrl+W</span>
                        <span class="block truncate text-[10px] text-mist-400">Close tab</span>
                    </span>
                </button>
            </div>
        </section>

        <!-- Screen capture -->
        <section>
            <div class="mb-2 flex items-center gap-2">
                <h4 class="text-[11px] font-semibold uppercase tracking-[0.12em] text-mist-400">Screen capture</h4>
                <span class="h-px flex-1 bg-ink-600"></span>
            </div>
            <div class="grid grid-cols-2 gap-1.5 md:grid-cols-3">
                <button class="hotkey-btn min-w-0" data-action="printscreen" title="Send Print Screen">
                    <i class="camera icon text-[15px] text-mist-400"></i>
                    <span class="min-w-0">
                        <span class="block truncate font-mono text-[11px]">PrtScn</span>
                        <span class="block truncate text-[10px] text-mist-400">Full screen</span>
                    </span>
                </button>
                <button class="hotkey-btn min-w-0" data-action="alt-printscreen" title="Send Alt+Print Screen">
                    <i class="desktop icon text-[15px] text-mist-400"></i>
                    <span class="min-w-0">
                        <span class="block truncate font-mono text-[11px]">Alt+PrtScn</span>
                        <span class="block truncate text-[10px] text-mist-400">Active window</span>
                    </span>
                </button>
                <button class="hotkey-btn min-w-0" data-action="mac-cmd-shift-3" title="Send Command+Shift+3">
                    <i class="camera icon text-[15px] text-mist-400"></i>
                    <span class="min-w-0">
                        <span class="block truncate font-mono text-[11px]">⌘+Shift+3</span>
                        <span class="block truncate text-[10px] text-mist-400">macOS full screen</span>
                    </span>
                </button>
                <button class="hotkey-btn min-w-0" data-action="mac-cmd-shift-4" title="Send Command+Shift+4">
                    <i class="crop icon text-[15px] text-mist-400"></i>
                    <span class="min-w-0">
                        <span class="block truncate font-mono text-[11px]">⌘+Shift+4</span>
                        <span class="block truncate text-[10px] text-mist-400">macOS region</span>
                    </span>
                </button>
            </div>
        </section>

    </div>

    <div class="flex items-center gap-2 border-t border-ink-600 px-3 py-2">
        <i class="usb icon text-mist-400"></i>
        <span class="kvm-hint">Each button sends one press-and-release burst over the HID link.</span>
    </div>

</div>

<script src="quick-access.js"></script>
