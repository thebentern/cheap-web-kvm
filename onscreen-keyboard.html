<!-- On-screen keyboard: sends real USB HID key events to the target.
     The host (#onscreenKeyboard in index.html) is a bare .kvm-float that
     onscreen-keyboard.js positions and drags, so this panel only styles itself.

     onscreen-keyboard.js toggles two state classes that app.css does not cover:
     `active` (key down) and `held` (latched modifier / hold mode). They are
     styled here so the panel is self-contained - amber for held matches the
     Hold button, which the same script marks with `orange`. -->
<div class="kvm-panel select-none p-2.5
            [&_.key.active]:translate-y-px
            [&_.key.active:not(.held)]:border-signal-400
            [&_.key.active:not(.held)]:bg-none
            [&_.key.active:not(.held)]:bg-signal-600
            [&_.key.active:not(.held)]:text-ink-950
            [&_.key.held]:border-warn-400
            [&_.key.held]:bg-none
            [&_.key.held]:bg-warn-400/20
            [&_.key.held]:text-warn-400">

    <div class="keyboard-drag-bar mb-2 flex items-center gap-2 rounded-lg bg-ink-900/70 px-2.5 py-1.5">
        <i class="keyboard icon blue"></i>
        <span class="text-xs font-semibold text-mist-100">On-screen keyboard</span>
        <span class="text-[11px] text-mist-400">Drag to move</span>

        <div class="keyboard-controls ml-auto flex items-center gap-1.5">
            <button id="btnToggleHoldMode"
                    class="kvm-btn px-2 py-1 text-[11px]
                           [&.orange]:border-warn-400 [&.orange]:bg-warn-400/15 [&.orange]:text-warn-400"
                    title="Hold Mode: OFF">
                <i class="lock icon"></i> Hold
            </button>
            <button id="btnCloseKeyboard" class="kvm-btn kvm-btn-icon h-7 w-7 p-1" title="Close">
                <i class="times icon"></i>
            </button>
        </div>
    </div>

    <div class="flex flex-col gap-1">

        <!-- Function row -->
        <div class="keyboard-row mb-0.5">
            <div class="key" data-key="27"><span class="key-label">Esc</span></div>
            <div class="key" data-key="112"><span class="key-label">F1</span></div>
            <div class="key" data-key="113"><span class="key-label">F2</span></div>
            <div class="key" data-key="114"><span class="key-label">F3</span></div>
            <div class="key" data-key="115"><span class="key-label">F4</span></div>
            <div class="key" data-key="116"><span class="key-label">F5</span></div>
            <div class="key" data-key="117"><span class="key-label">F6</span></div>
            <div class="key" data-key="118"><span class="key-label">F7</span></div>
            <div class="key" data-key="119"><span class="key-label">F8</span></div>
            <div class="key" data-key="120"><span class="key-label">F9</span></div>
            <div class="key" data-key="121"><span class="key-label">F10</span></div>
            <div class="key" data-key="122"><span class="key-label">F11</span></div>
            <div class="key" data-key="123"><span class="key-label">F12</span></div>
        </div>

        <!-- Number row -->
        <div class="keyboard-row">
            <div class="key" data-key="192"><span class="key-label">`</span><span class="key-sublabel">~</span></div>
            <div class="key" data-key="49"><span class="key-label">1</span><span class="key-sublabel">!</span></div>
            <div class="key" data-key="50"><span class="key-label">2</span><span class="key-sublabel">@</span></div>
            <div class="key" data-key="51"><span class="key-label">3</span><span class="key-sublabel">#</span></div>
            <div class="key" data-key="52"><span class="key-label">4</span><span class="key-sublabel">$</span></div>
            <div class="key" data-key="53"><span class="key-label">5</span><span class="key-sublabel">%</span></div>
            <div class="key" data-key="54"><span class="key-label">6</span><span class="key-sublabel">^</span></div>
            <div class="key" data-key="55"><span class="key-label">7</span><span class="key-sublabel">&amp;</span></div>
            <div class="key" data-key="56"><span class="key-label">8</span><span class="key-sublabel">*</span></div>
            <div class="key" data-key="57"><span class="key-label">9</span><span class="key-sublabel">(</span></div>
            <div class="key" data-key="48"><span class="key-label">0</span><span class="key-sublabel">)</span></div>
            <div class="key" data-key="189"><span class="key-label">-</span><span class="key-sublabel">_</span></div>
            <div class="key" data-key="187"><span class="key-label">=</span><span class="key-sublabel">+</span></div>
            <div class="key key-xwide" data-key="8"><span class="key-label">Backspace</span></div>
        </div>

        <!-- QWERTY row -->
        <div class="keyboard-row">
            <div class="key key-wide" data-key="9"><span class="key-label">Tab</span></div>
            <div class="key" data-key="81"><span class="key-label">Q</span></div>
            <div class="key" data-key="87"><span class="key-label">W</span></div>
            <div class="key" data-key="69"><span class="key-label">E</span></div>
            <div class="key" data-key="82"><span class="key-label">R</span></div>
            <div class="key" data-key="84"><span class="key-label">T</span></div>
            <div class="key" data-key="89"><span class="key-label">Y</span></div>
            <div class="key" data-key="85"><span class="key-label">U</span></div>
            <div class="key" data-key="73"><span class="key-label">I</span></div>
            <div class="key" data-key="79"><span class="key-label">O</span></div>
            <div class="key" data-key="80"><span class="key-label">P</span></div>
            <div class="key" data-key="219"><span class="key-label">[</span><span class="key-sublabel">{</span></div>
            <div class="key" data-key="221"><span class="key-label">]</span><span class="key-sublabel">}</span></div>
            <div class="key key-wide" data-key="220"><span class="key-label">\</span><span class="key-sublabel">|</span></div>
        </div>

        <!-- Home row -->
        <div class="keyboard-row">
            <div class="key key-xwide modifier-key key-caps
                        [&:not(.held)]:border-ink-600
                        [&:not(.held)]:bg-ink-800
                        [&:not(.held)]:bg-[linear-gradient(180deg,var(--color-ink-700),var(--color-ink-800))]
                        [&:not(.held)]:text-mist-200" data-key="20"><span class="key-label">Caps</span></div>
            <div class="key" data-key="65"><span class="key-label">A</span></div>
            <div class="key" data-key="83"><span class="key-label">S</span></div>
            <div class="key" data-key="68"><span class="key-label">D</span></div>
            <div class="key" data-key="70"><span class="key-label">F</span></div>
            <div class="key" data-key="71"><span class="key-label">G</span></div>
            <div class="key" data-key="72"><span class="key-label">H</span></div>
            <div class="key" data-key="74"><span class="key-label">J</span></div>
            <div class="key" data-key="75"><span class="key-label">K</span></div>
            <div class="key" data-key="76"><span class="key-label">L</span></div>
            <div class="key" data-key="186"><span class="key-label">;</span><span class="key-sublabel">:</span></div>
            <div class="key" data-key="222"><span class="key-label">'</span><span class="key-sublabel">"</span></div>
            <div class="key key-xwide" data-key="13"><span class="key-label">Enter</span></div>
        </div>

        <!-- Shift row -->
        <div class="keyboard-row">
            <div class="key key-xwide modifier-key key-shift-left" data-key="16"><span class="key-label">Shift</span></div>
            <div class="key" data-key="90"><span class="key-label">Z</span></div>
            <div class="key" data-key="88"><span class="key-label">X</span></div>
            <div class="key" data-key="67"><span class="key-label">C</span></div>
            <div class="key" data-key="86"><span class="key-label">V</span></div>
            <div class="key" data-key="66"><span class="key-label">B</span></div>
            <div class="key" data-key="78"><span class="key-label">N</span></div>
            <div class="key" data-key="77"><span class="key-label">M</span></div>
            <div class="key" data-key="188"><span class="key-label">,</span><span class="key-sublabel">&lt;</span></div>
            <div class="key" data-key="190"><span class="key-label">.</span><span class="key-sublabel">&gt;</span></div>
            <div class="key" data-key="191"><span class="key-label">/</span><span class="key-sublabel">?</span></div>
            <div class="key key-xwide modifier-key key-shift-right" data-key="16"><span class="key-label">Shift</span></div>
        </div>

        <!-- Modifier and arrow row -->
        <div class="keyboard-row">
            <div class="key modifier-key key-ctrl-left" data-key="17"><span class="key-label">Ctrl</span></div>
            <div class="key modifier-key" data-key="91"><span class="key-label">Win</span></div>
            <div class="key modifier-key key-alt-left" data-key="18"><span class="key-label">Alt</span></div>
            <div class="key key-space" data-key="32"><span class="key-label">Space</span></div>
            <div class="key modifier-key key-alt-right" data-key="18"><span class="key-label">Alt</span></div>
            <div class="key modifier-key key-ctrl-right" data-key="17"><span class="key-label">Ctrl</span></div>
            <div class="key" data-key="37"><span class="key-label">←</span></div>
            <div class="key" data-key="38"><span class="key-label">↑</span></div>
            <div class="key" data-key="40"><span class="key-label">↓</span></div>
            <div class="key" data-key="39"><span class="key-label">→</span></div>
        </div>

    </div>
</div>
<script src="onscreen-keyboard.js"></script>
