<!-- Paste box: types text into the target as real USB HID keystrokes.
     The host (#pasteBox in index.html) is a bare .kvm-float with no offsets,
     so the panel positions itself here. -->
<div class="kvm-panel fixed top-1/2 left-1/2 w-[min(92vw,30rem)] -translate-x-1/2 -translate-y-1/2 p-4">

    <div class="flex items-start justify-between gap-3">
        <div>
            <h3 class="flex items-center gap-2 text-sm font-semibold text-mist-100">
                <i class="clipboard icon blue"></i> Paste to target
            </h3>
            <p class="kvm-hint mt-1">
                Sent as keystrokes over HID, roughly 30 ms per character. Unsupported characters are skipped.
            </p>
        </div>
        <button id="btnClosePaste" class="kvm-btn kvm-btn-icon -mt-0.5 -mr-0.5 flex-none" title="Close">
            <i class="times icon"></i>
        </button>
    </div>

    <div class="mt-4 flex items-baseline justify-between gap-3">
        <span class="kvm-label">Text</span>
        <span class="paste-char-counter" id="pasteCharCounter">0 / 1000</span>
    </div>

    <textarea id="pasteTextarea"
              class="kvm-textarea kvm-scroll mt-1.5 h-40 leading-relaxed"
              placeholder="Text to type into the target machine..."
              maxlength="1000"></textarea>

    <div id="pasteProgressBar" class="kvm-progress mt-3" style="display: none;">
        <span class="bar"></span>
    </div>

    <div class="mt-4 flex flex-wrap items-center justify-end gap-2">
        <button id="btnCancelPaste" class="kvm-btn" style="display: none;">
            <i class="stop icon orange"></i> Cancel
        </button>
        <button id="btnClearPaste" class="kvm-btn">
            <i class="trash icon"></i> Clear
        </button>
        <button id="btnSendPaste" class="kvm-btn kvm-btn-primary">
            <i class="paper plane icon"></i> Send
        </button>
    </div>
</div>
<script src="paste-box.js"></script>
