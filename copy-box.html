<!-- Copy Box: area-select OCR of the target's screen.
     copy-box.js drives every element below by id and toggles visibility through
     inline `style.display`, so the `style="display:none;"` attributes stay. -->

<!-- Selection overlay - covers the viewport while the user drags a rectangle.
     The canvas is sized to window.innerWidth/Height and drawn with raw
     clientX/clientY, so it must sit at 0,0 at 1:1 scale; the utilities below
     drop the panel-style sizing that would otherwise offset the marquee. The
     overlay itself stays transparent because the canvas paints its own dimming
     mask and clears the selection to reveal the live video underneath. -->
<div id="copyBoxOverlay" class="copy-box-overlay bg-transparent backdrop-blur-none" style="display:none;">
    <canvas id="copyBoxCanvas"
            class="copy-box-canvas absolute inset-0 h-full w-full max-h-none max-w-none cursor-crosshair rounded-none border-0 bg-transparent"></canvas>

    <!-- pointer-events-none: copy-box.js only starts a drag when the event
         target is the canvas itself. -->
    <div class="kvm-panel pointer-events-none absolute left-1/2 top-6 flex -translate-x-1/2 items-center gap-2.5 px-3.5 py-2">
        <i class="crop icon text-signal-400"></i>
        <span class="text-[13px] text-mist-200">Drag to select a region to read</span>
        <span class="rounded-md border border-ink-600 bg-ink-800 px-1.5 py-0.5 font-mono text-[10px] text-mist-400">Esc</span>
    </div>
</div>

<!-- Language picker - copy-box.js positions this with fixed viewport
     coordinates and clamps against a 260px width, hence the explicit w-[260px]
     and a z-index above the overlay's 2600. -->
<div id="copyBoxLangPopup" class="kvm-panel fixed z-[2700] w-[260px] p-3.5" style="display:none;">
    <label for="copyBoxLangSelect" class="kvm-label flex items-center gap-2">
        <i class="magic icon text-signal-400"></i> OCR language
    </label>
    <select id="copyBoxLangSelect" class="kvm-select mt-2">
        <option value="eng" selected>English</option>
        <option value="chi_sim">Chinese (Simplified)</option>
        <option value="chi_tra">Chinese (Traditional)</option>
        <option value="jpn">Japanese</option>
        <option value="kor">Korean</option>
        <option value="fra">French</option>
        <option value="deu">German</option>
        <option value="spa">Spanish</option>
        <option value="por">Portuguese</option>
        <option value="ita">Italian</option>
        <option value="rus">Russian</option>
        <option value="ara">Arabic</option>
        <option value="hin">Hindi</option>
        <option value="tha">Thai</option>
        <option value="vie">Vietnamese</option>
        <option value="nld">Dutch</option>
        <option value="pol">Polish</option>
        <option value="tur">Turkish</option>
        <option value="ukr">Ukrainian</option>
        <option value="swe">Swedish</option>
    </select>
    <div class="mt-3 flex justify-end gap-2">
        <button id="copyBoxCancel" class="kvm-btn"><i class="times icon"></i> Cancel</button>
        <button id="copyBoxOk" class="kvm-btn kvm-btn-primary"><i class="check icon"></i> Read</button>
    </div>
</div>

<!-- Result panel - copy-box.js sets display:flex on the container, so the
     centring utilities here stay inert until it opens. -->
<div id="copyBoxResult" class="fixed inset-0 z-[2800] items-center justify-center bg-ink-950/70 p-4 backdrop-blur-sm" style="display:none;">
    <div class="kvm-panel flex w-full max-w-xl flex-col p-5">
        <div class="flex items-center gap-3">
            <span class="flex h-9 w-9 flex-none items-center justify-center rounded-xl bg-signal-500/10 text-signal-400">
                <i class="search icon"></i>
            </span>
            <div class="min-w-0">
                <h3 class="text-sm font-semibold text-mist-100">Extracted text</h3>
                <p class="kvm-hint">Recognized from the region you selected on the target.</p>
            </div>
        </div>

        <div id="copyBoxStatus" class="mt-4 items-center gap-2.5 rounded-lg border border-ink-600 bg-ink-900 px-3 py-2" style="display:none;">
            <i class="spinner icon text-signal-400"></i>
            <span id="copyBoxStatusText" class="text-[13px] text-mist-200">Initializing OCR…</span>
        </div>

        <textarea id="copyBoxTextarea" readonly rows="10"
                  placeholder="OCR result will appear here…"
                  class="kvm-textarea kvm-scroll mt-4 h-56 text-[13px] leading-relaxed"></textarea>

        <div class="mt-4 flex flex-wrap items-center justify-between gap-3">
            <label class="kvm-toggle">
                <input type="checkbox" id="copyBoxTrimSpaces">
                <span class="kvm-toggle-track"></span>
                <span class="kvm-toggle-text">Strip spaces (CJK)</span>
            </label>
            <div class="flex gap-2">
                <button id="copyBoxCloseBtn" class="kvm-btn"><i class="times icon"></i> Close</button>
                <button id="copyBoxCopyBtn" class="kvm-btn kvm-btn-primary"><i class="clipboard icon"></i> Copy</button>
            </div>
        </div>
    </div>
</div>

<script src="copy-box.js"></script>
