# Build the Nuxt UI and publish it to GitHub Pages.
# SPDX-License-Identifier: GPL-3.0-or-later
name: Deploy web UI to Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'docs/PROTOCOL.md'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let an in-flight one finish rather than cancelling.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # The protocol layer is verified against real hardware; a failure here
      # means the wire format drifted, so refuse to ship it.
      - name: Test protocol layer
        run: npm run test

      - name: Sync protocol docs into the published site
        run: cp ../docs/PROTOCOL.md public/PROTOCOL.md

      - name: Generate static site
        run: npm run generate
        env:
          NUXT_APP_BASE_URL: /cheap-web-kvm/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/.output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
