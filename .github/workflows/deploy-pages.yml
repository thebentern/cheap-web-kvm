# Build matching ESP32-S3 firmware and Nuxt UI, then publish them together.
# SPDX-License-Identifier: GPL-3.0-or-later
name: Deploy web UI to Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'firmware/**'
      - 'tools/package_firmware.py'
      - 'tools/test_package_firmware.py'
      - 'tools/test_led_pattern.py'
      - 'tools/verify_descriptors.py'
      - 'docs/PROTOCOL.md'
      - 'docs/VIRTUAL_MEDIA.md'
      - 'docs/WIFI.md'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let an in-flight one finish rather than cancelling.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Test firmware packaging and LED patterns
        working-directory: .
        run: |
          python3 tools/test_package_firmware.py
          python3 tools/test_led_pattern.py

      # Official Espressif action, pinned to the reviewed v1 commit. The v5.4
      # image matches the toolchain used to validate this firmware locally.
      - name: Build ESP32-S3 firmware and verify USB descriptors
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d
        with:
          esp_idf_version: v5.4
          target: esp32s3
          path: firmware
          command: idf.py build && python ../tools/verify_descriptors.py

      - name: Bundle firmware for the browser flasher
        working-directory: .
        run: python3 tools/package_firmware.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # The protocol layer is verified against real hardware; a failure here
      # means the wire format drifted, so refuse to ship it.
      - name: Test protocol layer
        run: npm run test

      - name: Sync protocol docs into the published site
        run: |
          cp ../docs/PROTOCOL.md public/PROTOCOL.md
          cp ../docs/VIRTUAL_MEDIA.md public/VIRTUAL_MEDIA.md
          cp ../docs/WIFI.md public/WIFI.md

      - name: Generate static site
        run: npm run generate
        env:
          NUXT_APP_BASE_URL: /cheap-web-kvm/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/.output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
